# The required check on main (WP5 D-2; WP0 R-14): no invalid state reaches main. It runs the meta-rule check, which
# replays every generator, and the full test suite, on every pull request and every push to main. Read-only token,
# no secrets, actions pinned by commit SHA (WP5 R-4). The environment is the one locked in uv.lock (WP5 review, G-1).
name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0             # the whole history, so every commit the records cite resolves (WP5 R-7)
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
      - name: Install the locked environment (uv.lock; Python from .python-version)
        run: uv sync --frozen
      - name: Meta-rule check
        run: uv run --frozen python scripts/validate.py
      - name: Tests
        run: uv run --frozen python -m unittest discover -s tests
