# The required check on main (WP5 D-2; WP0 R-14): no invalid state reaches main. It runs the meta-rule check, which
# replays every generator, and the full test suite, on every pull request and every push to main. Read-only token,
# no secrets, actions pinned by commit SHA (WP5 R-4).
name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0             # the whole history, so every commit the records cite resolves (WP5 R-7)
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.10"
      - run: python -m pip install pyyaml==6.0.3
      - name: Meta-rule check
        run: python scripts/validate.py
      - name: Tests
        run: python -m unittest discover -s tests
