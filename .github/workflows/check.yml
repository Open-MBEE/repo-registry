# The required check on main (WP5 D-2; WP0 R-14): no invalid state reaches main. It runs the meta-rule check, which
# replays every generator, and the full test suite, on every pull request and every push to main. Read-only token,
# no secrets, actions pinned by commit SHA (WP5 R-4). The environment is the one locked in uv.lock (WP5 review, G-1).
# It then renders every view in demo mode, uploads them as an artifact, and, on a pull request, writes how the change
# alters the views into the job summary (WP5b D-4; views are never committed, OD4).
name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0             # the whole history, so every commit the records cite resolves (WP5 R-7)
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
      - name: Install the locked environment (uv.lock; Python from .python-version)
        run: uv sync --frozen
      - name: Meta-rule check
        run: uv run --frozen python scripts/validate.py
      - name: Tests
        run: uv run --frozen python -m unittest discover -s tests
      - name: Render the views in demo mode (WP5b OD5)
        run: uv run --frozen python scripts/render.py --mode demo --out build/demo
      - name: How this change alters the views (job summary)
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          git worktree add --detach build/base "$BASE"
          if [ -f build/base/scripts/render.py ]; then
            uv run --frozen python build/base/scripts/render.py --root build/base --out build/base-views
          fi
          uv run --frozen python scripts/view_diff.py build/base-views build/demo >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: rendered-views
          path: build/demo/
