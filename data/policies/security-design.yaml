# PROVISIONAL until the maintainers approve the policies (WP0, maintainer approval 2). WP2 D-2.
id: security-design
scope: repository                               # what the policy governs: a repository, or the org's administration
name: Documented security design
meaning: High-tier repositories keep a short design document that describes the security controls of what they build, and
  keep it current.
applies_if:
  attr: tier
  eq: high
github:
  mechanism: 'None: a document in the repository, attested by its code owners'
  docs:
  - https://docs.github.com/en/repositories/managing-your-repositorys-settings-and-features/customizing-your-repository/about-readmes
  available_on:
  - free
  - team
  - enterprise
checks:
  automated: []
  attested:
  - id: design-current
    statement: A design document describes the security controls (the measures that protect the software and its users, such
      as who can sign in, how data is protected, and how input is checked) and is updated when they change.
cites:
  cisa:
  - CISA-C4-CONFIG
  nist:
  - SA-8
  - SA-17
  - PL-8
  openssf:
  - TG-1
  iso12207:
  - 6.4.4
setup:                                   # the SOP's set-up steps, in order (WP5b: SOPs are rendered from this file)
- 'Write a short design document (for example `docs/design.md`) that describes the security controls of what the repository builds: the measures that protect it and its users, such as who can sign in, how data is protected, and how input is checked.'
- Update it whenever those controls change.
- Record the attestation below.
