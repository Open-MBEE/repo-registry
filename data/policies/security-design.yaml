# PROVISIONAL until the maintainers approve the policies (WP0, maintainer approval 2). WP2 D-2.
status: provisional
provisional_until: 'WP0 maintainer approval 2: the policies'
id: security-design
name: Documented security design
meaning: High-tier repositories keep a short design document that describes the security controls of what they build, and
  keep it current.
applies_if:
  all:
  - attr: tier
    eq: high
  - not:
      all:
      - attr: type
        eq: governance
      - attr: lifecycle
        eq: graduated
github:
  mechanism: 'None: a document in the repository, attested by its code owners'
  docs:
  - https://docs.github.com/en/repositories/managing-your-repositorys-settings-and-features/customizing-your-repository/about-readmes
checks:
  automated: []
  attested:
  - id: design-current
    statement: A design document describes the security controls and is updated when they change.
cites:
  cisa:
  - CISA-C4-CONFIG
  nist:
  - SA-8
  - SA-17
  - PL-8
  openssf:
  - TG-1
  iso12207:
  - 6.4.4
sop: docs/sops/security-design.md
