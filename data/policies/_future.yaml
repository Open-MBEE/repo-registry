# Features and plans (WP3 G-3). OpenMBEE is on GitHub Free (data/sources/github-plan.yaml).
# needs_research: features the policies use whose availability for the Open-MBEE org isn't confirmed yet. Empty:
#   immutable releases and rulesets were confirmed by the supervisor (data/sources/github-plan.yaml, confirmed_in_org).
# features: features no policy may require today (Enterprise-only), flagged for a future upgrade.
needs_research: {}
features:
  org-rulesets:
    why: Organization-wide rulesets need GitHub Team or Enterprise.
    would_strengthen: history-protection, change-review (set once for all repositories)
  audit-log-api:
    why: The organization audit-log API is Enterprise Cloud only.
    would_strengthen: maintainers-match (who changed roles, and when)
  saml-sso:
    why: SAML single sign-on is Enterprise Cloud only.
    would_strengthen: org-two-factor
  custom-roles:
    why: Custom organization and repository roles are Enterprise Cloud only.
    would_strengthen: maintainer-policy (fine-grained maintainer powers)
  owner-only-collaborator-invites:
    why: Restricting outside-collaborator invitations to owners is Enterprise Cloud only.
    would_strengthen: org-few-owners
