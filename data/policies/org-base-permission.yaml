# PROVISIONAL until the maintainers approve the policies (WP0, maintainer approval 2). WP3 D-2.
status: provisional
provisional_until: 'WP0 maintainer approval 2: the policies'
id: org-base-permission
name: Least-privilege base permission
meaning: Members of the organization get only read access to its repositories by default. More access is granted per repository,
  through teams.
applies_if:
  all:
  - attr: type
    eq: governance
  - attr: stage
    eq: graduated
github:
  mechanism: 'Organization setting: base permissions for members'
  docs:
  - https://docs.github.com/en/organizations/managing-user-access-to-your-organizations-repositories/managing-repository-roles/setting-base-permissions-for-an-organization
  - https://docs.github.com/en/rest/orgs/orgs
  available_on:
  - free
  - team
  - enterprise
checks:
  automated:
  - id: base-permission-read
    reads: 'GET /orgs/{org} -> default_repository_permission in (read, none) (returned only to owners: yellow otherwise)'
    permission: 'organization owner (Administration: read)'
  attested: []
cites:
  cisa: none
  nist:
  - AC-6
  openssf:
  - TI-3
sop: docs/sops/org-base-permission.md
