# PROVISIONAL until the maintainers approve the policies (WP0, maintainer approval 2). WP2 D-2.
id: secret-protection
scope: repository                               # what the policy governs: a repository, or the org's administration
name: Block secrets from being pushed
meaning: Tools from version 1.0, and the registry, turn on push protection, so that GitHub blocks a push that contains a password,
  key or token.
applies_if:
  all:
  - attr: type
    in:
    - tool
    - governance
  - attr: stage
    in:
    - incubating
    - graduated
github:
  mechanism: Secret scanning push protection (repository security settings)
  docs:
  - https://docs.github.com/en/code-security/secret-scanning/introduction/about-push-protection
  - https://docs.github.com/en/rest/repos/repos
  available_on:
  - free
  - team
  - enterprise
checks:
  automated:
  - id: push-protection-on
    reads: 'GET /repos/{owner}/{repo} -> security_and_analysis.secret_scanning_push_protection.status == enabled (the block
      is absent without admin read: yellow, not off)'
    permission: 'Administration: read'
  attested: []
cites:
  cisa:
  - CISA-P-SECRET-DETECT
  - CISA-P-PREPUB-REVIEW
  nist:
  - IA-5(7)
  openssf:
  - TI-2
setup:                                   # the SOP's set-up steps, in order (WP5b: SOPs are rendered from this file)
- Go to the repository's Settings, then Advanced Security (or Code security).
- Turn on Secret Protection, if it is offered, and Push protection.
- Push protection then blocks any push that contains a detected password, key or token.
