# PROVISIONAL until the maintainers approve the policies (WP0, maintainer approval 2). WP2 D-2.
status: provisional
provisional_until: 'WP0 maintainer approval 2: the policies'
id: change-review
name: Reviewed changes
meaning: High-tier repositories (graduated tools, and the registry) need at least one approving review from a code owner,
  and passing checks, before a change is merged to the default branch.
applies_if:
  all:
  - attr: tier
    eq: high
  - not:
      all:
      - attr: type
        eq: governance
      - attr: lifecycle
        eq: graduated
github:
  mechanism: A ruleset (preferred) or a branch protection rule requiring an approving code-owner review and passing status
    checks
  docs:
  - https://docs.github.com/en/rest/repos/rules
  - https://docs.github.com/en/repositories/configuring-branches-and-merges-in-your-repository/managing-rulesets/available-rules-for-rulesets
  available_on:
  - free
  - team
  - enterprise
  needs_research:
  - rulesets
checks:
  automated:
  - id: review-required
    reads: GET /repos/{owner}/{repo}/branches/{default_branch}/protection -> required_pull_request_reviews.required_approving_review_count
      >= 1 and .require_code_owner_reviews, or the same in a pull_request rule of GET .../rules/branches/{default_branch}
    permission: 'Administration: read (classic protection); Metadata: read (rulesets)'
  - id: checks-required
    reads: GET /repos/{owner}/{repo}/branches/{default_branch}/protection -> required_status_checks is set, or GET .../rules/branches/{default_branch}
      has a required_status_checks rule
    permission: 'Administration: read (classic protection); Metadata: read (rulesets)'
  attested: []
cites:
  cisa:
  - CISA-P-CODE-REVIEW
  - CISA-C4-CONDUCT
  nist:
  - CM-5(4)
  - SA-11(4)
  - CM-3
  openssf:
  - TG-4
sop: docs/sops/change-review.md
