# PROVISIONAL until the maintainers approve the policies (WP0, maintainer approval 2). WP2 D-2.
status: provisional
provisional_until: 'WP0 maintainer approval 2: the policies'
id: workflow-least-privilege
name: Least-privilege automation
meaning: Tools from version 1.0, and the registry, give their GitHub Actions workflows read-only access by default, and set
  up workflows following GitHub's hardening guidance.
applies_if:
  any:
  - all:
    - attr: type
      eq: tool
    - attr: lifecycle
      in:
      - incubating
      - graduated
  - all:
    - attr: type
      eq: governance
    - attr: lifecycle
      eq: sandbox
github:
  mechanism: Actions default workflow permissions set to read
  docs:
  - https://docs.github.com/en/rest/actions/permissions
  - https://docs.github.com/en/actions/security-for-github-actions/security-guides/security-hardening-for-github-actions
checks:
  automated:
  - id: default-token-read
    reads: GET /repos/{owner}/{repo}/actions/permissions/workflow -> default_workflow_permissions == read
    permission: 'Administration: read'
  attested:
  - id: workflows-hardened
    statement: 'Workflows follow GitHub''s hardening guidance: no untrusted input in run steps, no checkout of untrusted pull
      request code in privileged triggers, and only the permissions each job needs.'
cites:
  cisa:
  - CISA-P-SSDF
  nist:
  - AC-6
  openssf:
  - TI-3
  - OI-1
sop: docs/sops/workflow-least-privilege.md
