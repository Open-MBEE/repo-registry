# PROVISIONAL until the maintainers approve the policies (WP0, maintainer approval 2). WP2 D-2.
status: provisional
provisional_until: 'WP0 maintainer approval 2: the policies'
id: project-files
name: README
meaning: Every live repository has a README that says what it is and how to use it. (Its license is covered by license-by-type.)
applies_if:
  all:
  - not:
      attr: lifecycle
      eq: archived
  - not:
      all:
      - attr: type
        eq: governance
      - attr: lifecycle
        eq: graduated
github:
  mechanism: A README file, detected by GitHub's community profile
  docs:
  - https://docs.github.com/en/rest/metrics/community
  available_on:
  - free
  - team
  - enterprise
checks:
  automated:
  - id: readme-present
    reads: GET /repos/{owner}/{repo}/community/profile -> files.readme is not null
    permission: 'Contents: read'
  attested: []
cites:
  cisa:
  - CISA-P-README
  nist: none
  openssf: []
sop: docs/sops/project-files.md
