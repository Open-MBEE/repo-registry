# PROVISIONAL until the maintainers approve the policies (WP0, maintainer approval 2). WP2 D-2.
status: provisional
provisional_until: 'WP0 maintainer approval 2: the policies'
id: security-policy
name: Vulnerability reporting
meaning: Tools from version 1.0, and the registry, publish a security policy that says how to report a vulnerability and who
  responds, and turn on GitHub's private vulnerability reporting.
applies_if:
  all:
  - attr: type
    in:
    - tool
    - governance
  - attr: lifecycle
    in:
    - incubating
    - graduated
github:
  mechanism: SECURITY.md security policy and private vulnerability reporting
  docs:
  - https://docs.github.com/en/code-security/getting-started/adding-a-security-policy-to-your-repository
  - https://docs.github.com/en/rest/repos/repos
  available_on:
  - free
  - team
  - enterprise
checks:
  automated:
  - id: security-policy-present
    reads: GraphQL repository { isSecurityPolicyEnabled } == true
    permission: 'Metadata: read'
  - id: private-reporting-on
    reads: GET /repos/{owner}/{repo}/private-vulnerability-reporting -> enabled == true
    permission: 'Metadata: read'
  attested:
  - id: disclosure-followed
    statement: Reports are answered following the published process, which also says what to expect for automated or AI-assisted
      reports.
cites:
  cisa:
  - CISA-P-SECURITY-MD
  - CISA-P-VDP-BOD
  - CISA-P-VDP-AI-REPORTS
  - CISA-P-SECURITY-CONTACT
  nist:
  - RA-5(11)
  openssf:
  - OI-3
sop: docs/sops/security-policy.md
