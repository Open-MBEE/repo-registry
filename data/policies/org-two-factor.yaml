# PROVISIONAL until the maintainers approve the policies (WP0, maintainer approval 2). WP3 D-2.
status: provisional
provisional_until: 'WP0 maintainer approval 2: the policies'
id: org-two-factor
name: Two-factor authentication for everyone
meaning: The organization requires two-factor authentication for every member and outside collaborator.
applies_if:
  all:
  - attr: type
    eq: governance
  - attr: stage
    eq: graduated
github:
  mechanism: 'Organization setting: require two-factor authentication'
  docs:
  - https://docs.github.com/en/organizations/keeping-your-organization-secure/managing-two-factor-authentication-for-your-organization/requiring-two-factor-authentication-in-your-organization
  - https://docs.github.com/en/rest/orgs/orgs
  available_on:
  - free
  - team
  - enterprise
checks:
  automated:
  - id: two-factor-required
    reads: 'GET /orgs/{org} -> two_factor_requirement_enabled == true (returned only to owners: yellow otherwise)'
    permission: 'organization owner (Administration: read)'
  attested: []
cites:
  cisa: none
  nist:
  - IA-2(1)
  openssf:
  - SB-2
sop: docs/sops/org-two-factor.md
