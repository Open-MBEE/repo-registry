# The OpenSSF security baseline, item by item, paraphrased (WP2 backbone, OD1).
# Source: ossf/tac, process/security_baseline.md, commit 098faba (2025-06-27).
#   https://github.com/ossf/tac/blob/098faba/process/security_baseline.md
# Each item is adopted by one of our policies (its `cites.openssf` lists the item) or departed from in
# data/policies/_departures.yaml with a reason (WP2 R-13). Stage names match ours (WP1 amendment A4).
source:
  repo: ossf/tac
  path: process/security_baseline.md
  commit: 098faba

items:
  SB-1: {stage: sandbox, when: once, title: "New projects or components use a memory-safe language (or C/C++ compiler hardening)"}
  SB-2: {stage: sandbox, when: once, title: "Two-factor authentication for interactive repository access"}
  TI-1: {stage: incubating, when: to-become, title: "Onboard to OpenSSF Scorecard (Scorecard GitHub Action)"}
  TI-2: {stage: incubating, when: to-become, title: "No hard-coded active secrets in the repository"}
  TI-3: {stage: incubating, when: to-become, title: "Credentials have minimal permissions (least privilege, workflow tokens, few owners and admins)"}
  TI-4: {stage: incubating, when: to-become, title: "Security insights metadata file (SECURITY_INSIGHTS.yml)"}
  TI-5: {stage: incubating, when: to-become, title: "A dependencies policy is published, maintained and followed"}
  TI-6: {stage: incubating, when: to-become, title: "Direct dependencies are pinned in services the project provides"}
  OI-1: {stage: incubating, when: once, title: "GitHub Actions workflows are set up securely"}
  OI-2: {stage: incubating, when: once, title: "Static code analysis runs in CI and critical exploitable findings are fixed promptly"}
  OI-3: {stage: incubating, when: once, title: "A security policy for vulnerability disclosure and response is published and followed; private vulnerability reporting enabled"}
  OI-4: {stage: incubating, when: once, title: "Data in transit is protected cryptographically"}
  TG-1: {stage: graduated, when: to-become, title: "An architecture design with up-to-date security controls is maintained"}
  TG-2: {stage: graduated, when: to-become, title: "No medium or higher severity findings from static analysis"}
  TG-3: {stage: graduated, when: to-become, title: "Known vulnerabilities fixed: critical promptly, medium or high within 60 days"}
  TG-4: {stage: graduated, when: to-become, title: "Merging to the main branch needs at least one maintainer approval and passing status checks"}
  TG-5: {stage: graduated, when: to-become, title: "No generated executable artifacts in the source repository"}
  TG-6: {stage: graduated, when: to-become, title: "An SBOM is generated and published with each release"}
  TG-7: {stage: graduated, when: to-become, title: "Release artifacts are cryptographically signed"}
  TG-8: {stage: graduated, when: to-become, title: "SLSA v1.0 Build Level 3 provenance is published with releases"}
  TG-9: {stage: graduated, when: to-become, title: "Security events are logged (for internet or infrastructure services run for the foundation)"}
  TG-10: {stage: graduated, when: to-become, title: "Security events are monitored (for internet or infrastructure services run for the foundation)"}
  TG-11: {stage: graduated, when: to-become, title: "An initial third-party security audit, with findings addressed (for services run for the foundation)"}
  OG-1: {stage: graduated, when: once, title: "Known vulnerabilities are fixed and released in coordination with consumers, within the same deadlines"}
  OG-2: {stage: graduated, when: once, title: "Security audits as needed after the initial one (for services run for the foundation)"}
