# PROVISIONAL. WP5b D-1: the declared data model. scripts/validate.py enforces it on every pull request (D-5).
#
# The repository's records are the tables of a database (WP5b; the supervisor: "let's treat it like a database").
# Each table names its role, where its rows live, its key, and its columns. scripts/model.py reads the rows; this file
# says what a valid row is. A broken key or join is a construction error: invalid, and CI rejects it (WP0 R-14).
#
# Roles (MVC, WP5b): `source` tables are read-only facts from GitHub or a cited document; `model` tables are what
# people decide, changed only by a governed pull request. Views are rendered and never committed (OD4); they are
# listed at the end. The pilot list is a model table (OD6).
#
# Column types: id (integer), name, text, int, bool, date, predicate (the kinds.yaml predicate language), path (a
# file in this repository), test (a test that exists: file::Class::method), enum(a, b), list(<type>),
# fk(table) or fk(table.column) for a foreign key, mapping (free-form; only in source rows). optional(<type>) marks an
# optional column. `foreign` declares a composite foreign key ("col1, col2": table). `open: true` allows columns
# not listed (sensed source rows). `one_of` lists column sets of which a row has exactly one.

version: 1
snapshot: data/snapshots/2026-10-18             # the current snapshot, declared once (F-14)

enums:
  plan: [free, team, enterprise]
  color: [green, yellow, red]                     # a check result (F-11)
  status: [provisional, approved]                 # the lifecycle mark of provisional data (F-11)
  scope: [repository, org]
  check_mode: [automated, attested]
  cite_source: [cisa, nist, openssf, iso12207, dodcio, ofac, ssdf, c_scrm]   # the last four: WP5e
  baseline_when: [once, to-become]
  pilot_role: [must_include, self_registered]
  kind_source: [inferred, topic, maintainer]       # WP5c OD1: where a kind came from; precedence rises left to right

tables:

  # --- sources: read-only ---------------------------------------------------------------------------------------
  repo:
    role: source
    rows: "the snapshot's repos.json, with ids.json and forks.json (a repository created after the snapshot has no sensed columns)"
    key: [repo_id]
    unique: [name]
    open: true
    columns: {repo_id: id, name: name, after_snapshot: optional(bool)}
  repo_usage:
    role: source
    rows: the snapshot's usage.json (keyed there by name; joined to repo by name)
    key: [repo_id]
    open: true
    columns: {repo_id: fk(repo), name: name}
  org_snapshot:
    role: source
    rows: the snapshot's org.json (one row)
    open: true
  cisa_practice:
    role: source
    rows: data/sources/cisa-practices.yaml, practices
    key: [practice_id]
    columns: {practice_id: name, page: text, section: text, practice: text}
  nist_control:
    role: source
    rows: data/sources/nist-800-53.yaml, controls
    key: [control_id]
    columns: {control_id: name, title: text, parent: optional(name), context: optional(text)}
    # parent: the base control of an enhancement; context: why a control no policy cites is in the file (WP5d)
    rule: "a control that no policy cites states its context (WP5d, observation 2)"
  openssf_item:
    role: source
    rows: data/sources/openssf-security-baseline.yaml, items
    key: [item_id]
    columns: {item_id: name, stage: fk(stage), when: enum(baseline_when), title: text}
  iso_clause:
    role: source
    rows: data/sources/iso12207-clauses.yaml, clauses (number and title only; WP2 R-12)
    key: [clause]
    columns: {clause: name, title: text}
  dodcio_section:                                # WP5e D-1: quoted verbatim (OD6)
    role: source
    rows: data/sources/dod-cio-oss-memo.yaml, sections
    key: [section]
    columns: {section: name, page: name, title: text, text: text, context: optional(text)}
  ofac_item:                                     # WP5e D-2
    role: source
    rows: data/sources/ofac.yaml, items
    key: [item]
    columns: {item: name, title: text, where: text, text: text}
  ssdf_practice:                                 # WP5e D-2
    role: source
    rows: data/sources/nist-800-218.yaml, practices
    key: [practice]
    columns: {practice: name, page: name, title: text, text: text, tasks: mapping, context: optional(text)}
  c_scrm_control:                                # WP5e D-2
    role: source
    rows: data/sources/nist-800-161.yaml, controls
    key: [control]
    columns: {control: name, page: name, title: text, text: text}
  github_plan:
    role: source
    rows: data/sources/github-plan.yaml (one row)
    open: true
    columns: {plan: enum(plan)}

  # --- the taxonomy --------------------------------------------------------------------------------------------
  type:
    role: model
    rows: data/taxonomy/kinds.yaml, types
    key: [type]
    columns: {type: name, meaning: text}
  stage:
    role: model
    rows: data/taxonomy/kinds.yaml, stages
    key: [stage]
    columns: {stage: name, meaning: text}
  tier:
    role: model
    rows: data/taxonomy/tiers.yaml, tiers
    key: [tier]
    unique: [order]
    columns: {tier: name, order: int, meaning: text}
  kind:
    role: model
    rows: data/taxonomy/kinds.yaml, kinds (keyed by type, then stage)
    key: [type, stage]                            # a composite key; the name "type/stage" is derived (OD2)
    columns: {type: fk(type), stage: fk(stage), tier: fk(tier), meaning: text, recommend_when: predicate}
  omitted_kind:
    role: model
    rows: data/taxonomy/kinds.yaml, omitted (keyed by type, then stage)
    key: [type, stage]
    disjoint_from: kind                           # defined or omitted, never both (WP1 R-3)
    columns: {type: fk(type), stage: fk(stage), reason: text}
  signal:
    role: model
    rows: data/taxonomy/kinds.yaml, signals
    key: [signal]
    columns: {signal: name, when: predicate}
  signal_explanation:
    role: model
    rows: data/taxonomy/kinds.yaml, explain
    key: [signal]
    columns: {signal: fk(signal), explain: text}
    rule: "every signal has exactly one explanation, in plain words, for the wiki (WP5d D-1)"
  flag:
    role: model
    rows: data/taxonomy/kinds.yaml, flags
    key: [flag]
    columns: {flag: name, meaning: text, when: predicate}
  unclassified_reason:
    role: model
    rows: "data/taxonomy/kinds.yaml, unclassified_reasons (ordered: the first that holds gives the reason)"
    key: [position]
    columns: {position: int, when: predicate, reason: text}

  # --- the kind list and assignments ---------------------------------------------------------------------------
  registry_entry:
    role: model
    rows: registry.yaml, repos
    key: [repo_id]
    columns: {repo_id: fk(repo), name: name, type: optional(fk(type)), stage: optional(fk(stage)),
              reason: optional(text), source: enum(kind_source), decision: optional(text)}
    one_of: [[type, stage], [reason]]             # WP4e OD2
    foreign: {"type, stage": kind}
    rule: "a decision is stated exactly when the source is maintainer (WP5c OD1; data/assignments.yaml folded in)"
  org_entry:
    role: model
    rows: registry.yaml, org (one row)
    columns: {name: name, type: fk(type), stage: fk(stage), source: enum(kind_source), decision: optional(text)}
    foreign: {"type, stage": kind}

  # --- policies ------------------------------------------------------------------------------------------------
  policy_set:
    role: model
    rows: data/policies/_set.yaml (one row)
    columns: {status: enum(status), provisional_until: optional(text)}
  policy:
    role: model
    rows: data/policies/<policy_id>.yaml, one file per row (the file name is the key)
    key: [policy_id]
    columns: {policy_id: name, scope: enum(scope), name: text, meaning: text, applies_if: predicate, github: mapping,
              setup: list(text), secondary_notes: optional(text), applies_note: optional(text),
              allowed_licenses: optional(mapping),
              license_guidance: optional(mapping)}
  policy_check:
    role: model
    rows: each policy's checks
    key: [policy_id, check_id]
    unique: [check_id]
    columns: {policy_id: fk(policy), check_id: name, mode: enum(check_mode), reads: optional(text), permission: optional(text),
              statement: optional(text)}
  policy_cite:
    role: model
    rows: each policy's cites (a list per source; "none" for no core citation)
    key: [policy_id, source, ref]
    columns: {policy_id: fk(policy), source: enum(cite_source), ref: name}
    foreign_by_source: {cisa: cisa_practice, nist: nist_control, openssf: openssf_item, iso12207: iso_clause,
                        dodcio: dodcio_section, ofac: ofac_item, ssdf: ssdf_practice, c_scrm: c_scrm_control}
  departure:
    role: model
    rows: data/policies/_departures.yaml
    key: [source, ref]
    columns: {source: enum(cite_source), ref: name, reason: text}
    foreign_by_source: {cisa: cisa_practice, openssf: openssf_item}
  future_feature:
    role: model
    rows: data/policies/_future.yaml, features
    key: [feature]
    columns: {feature: name, reason: text, strengthens: list(fk(policy)), note: optional(text)}
  deviation:
    role: model
    rows: data/deviations.yaml, deviations
    key: [repo_id, policy]
    columns: {repo_id: fk(repo), name: name, policy: fk(policy), reason: text, approved_by: fk(maintainer.login)}

  # --- org governance -------------------------------------------------------------------------------------------
  maintainer:
    role: model
    rows: data/maintainers.yaml, maintainers
    key: [user_id]                                # GitHub's numeric user ID (F-05)
    unique: [login]
    columns: {user_id: id, login: name, name: text, basis: text}
  maintainer_verification:                       # WP5e D-4: an owner's verification, with the facts the maintainer
    role: model                                  # consents to publish (OD2); nothing else is recorded
    rows: data/maintainers.yaml, maintainers, each entry's verification
    key: [user_id]
    columns: {user_id: fk(maintainer), legal_name: text, country_of_residence: text, affiliation: text,
              verified_by: fk(maintainer), date: date, policy_version: name}
    rule: "the verifier is not the maintainer verified (WP5e default 2)"
  release_authority:
    role: model
    rows: each maintainer's release_authority
    key: [user_id, repo_id]
    columns: {user_id: fk(maintainer), repo_id: fk(repo), name: name}
  maintainer_set:
    role: model
    rows: data/maintainers.yaml (one row)
    columns: {target_size: int, other_powers: list(mapping)}
  proposed_codeowner:
    role: model
    rows: data/proposed-codeowners, each @login
    key: [login]
    columns: {login: fk(maintainer.login)}

  # --- the pilot (a model table, OD6) ---------------------------------------------------------------------------
  pilot_category:
    role: model
    rows: data/pilot-rule.yaml, categories
    key: [category]
    columns: {category: name, quota: int, meaning: text, where: predicate, sort_by: name}
  pilot_named:
    role: model
    rows: data/pilot-rule.yaml, must_include and self_registered
    key: [repo_id]
    columns: {repo_id: fk(repo), name: name, role: enum(pilot_role)}
  pilot_member:
    role: model
    rows: data/pilot.yaml, repos
    key: [repo_id]
    columns: {repo_id: fk(repo), name: name, category: optional(fk(pilot_category)), reason: text}
  excluded:
    role: model
    rows: data/exclude.yaml, repos (a row's reason is default_reason unless it states one; F-10)
    key: [repo_id]
    disjoint_from: pilot_member
    columns: {repo_id: fk(repo), name: name, reason: optional(text)}

  # --- controls and gaps (F-16, revised) ------------------------------------------------------------------------
  control:
    role: model
    rows: data/controls.yaml, construction controls (a violation is invalid; CI fails)
    key: [control_id]
    columns: {control_id: name, statement: text, test: test}
  forthcoming:
    role: model
    rows: data/forthcoming.yaml, forthcoming (capabilities not built yet)
    key: [gap_id]
    columns: {gap_id: name, capability: text, closes_in: text, evidence_when_closed: text, test: test}
  measured_gap:
    role: model
    rows: "data/measured-gaps.yaml, measured (known non-passes of compliance controls: the error signal, kept)"
    key: [gap_id]
    columns: {gap_id: name, repo_id: fk(repo), name: name, policy: fk(policy), check: name, color: enum(color),
              reason: text, known_from: text, closes_in: text}
    foreign: {"policy, check": policy_check}

# Columns that a predicate may read without a table storing them (F-15): each is derived by a controller.
derived:
  has_semver_release: scripts/recommend.py derive(), from the repo's release tags
  latest_semver: scripts/recommend.py derive()
  latest_semver_major: scripts/recommend.py derive()
  archive_candidate: scripts/pilot.py, the archive-candidate flag from the kind recommendations
  usage_score: scripts/pilot.py, from the pilot rule's weights and repo_usage
  release_downloads: scripts/pilot.py, from repo_usage
  declared_type: "scripts/recommend.py derive(), from the repo's topics and kinds.yaml type_topics (exactly one, else none; WP5c)"
  fork_ahead_by: "scripts/model.py, from the snapshot's forks.json: commits of ours ahead of the upstream (WP5c D-3)"
  fork_mostly_models: "scripts/model.py, from forks.json: more than half the files we changed are models"
  clone_uniques_14d: scripts/pilot.py, from repo_usage (0 where unreadable)
  tier: scripts/pilot.py, from the kind
  type: scripts/pilot.py, from the kind list
  stage: scripts/pilot.py, from the kind list

# Views: rendered by scripts/render.py in demo mode into build/demo/ (OD5); never committed (OD4).
views:
  kind_recommendations: reports/kind-recommendations.yaml, from repo, kind, signal, flag, unclassified_reason and the maintainer entries
  kind_list_draft: kind-list-draft.yaml, the kind list the rules and topics would give
  kind_list_refresh: kind-list-refresh.yaml, the inferred and topic entries the rules or topics would change today
  fit_report: fit-report.md, unclassified repositories by reason, in the kind list and in the rules' draft
  policy_applicability: policy-applicability.md and reports/policy-applicability.yaml, from kind and policy
  license_report: reports/license-report.yaml, from repo, registry_entry, kind, policy, deviation
  maintainers_match: reports/maintainers-match.yaml, from org_snapshot, maintainer, proposed_codeowner
  pilot_proposal: pilot-proposal.yaml, what the pilot rule would propose today
  pilot_briefing: pilot-briefing.md, from pilot_member, registry_entry, kind and the views above
  sops: sops/<policy_id>.md, from policy, policy_check, policy_cite and policy_applicability
  policy_basis_tables: policy-basis-tables.md, from policy, policy_cite, departure and the sources
  data_model: data-model.md, from this file
