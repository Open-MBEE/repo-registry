# PROVISIONAL until the maintainers approve the pilot (WP0, maintainer approval 3). WP4 D-2.
# The rule that picks the pilot from the snapshot. scripts/pilot.py applies it deterministically: categories are
# filled in order, each repository goes to the first category that takes it, and ties break by name.
#
# `where` uses the predicate language of data/taxonomy/kinds.yaml, over these attributes of each repository:
#   name, description, kind, type, lifecycle, tier, fork, archived, commits_last_3_months, commits_last_12_months,
#   archive_candidate (WP1 flag), usage_score (below), release_downloads, clone_uniques_14d (0 where unreadable).
# `quota` counts the must-include repositories that fall in the category.
status: provisional
provisional_until: "WP0 maintainer approval 3: the initial subset of repos in the registry"

# Supervisor's must-includes (WP4 OD1).
must_include: [sysml-toolkit, OpenSysML, flexo-mms-layer1-service, flexo-mms-deployment, flexo-mms.openmbee.org,
               flexo-mms-sysmlv2]
# This repository registers itself (design.md X-9), though it isn't in the org yet. Added by the agent, not the supervisor.
self_registered: [repo-registry]

# "Heavily used" (WP4 default): release downloads, clone visitors where readable (push access, last 14 days), stars
# and forks. An unreadable clone count adds nothing; it is never treated as zero use in the briefing.
usage_score:
  release_downloads: 1
  clone_uniques_14d: 10
  stars: 5
  forks: 5

categories:                       # WP4 OD2: about 30 in all
  - id: tools-actively-developed
    quota: 6
    meaning: Tools changed in the last three months, including busy tools still below 1.0. Ranked by use (release
      downloads, clone visitors, stars, forks).
    where: {all: [{attr: type, eq: tool}, {attr: archived, eq: false}, {attr: commits_last_3_months, gt: 0}]}
    sort_by: usage_score
  - id: tools-heavily-used
    quota: 6
    meaning: Tools at 1.0 or later with clear evidence of use (at least 100 release downloads, or at least 20 clone
      visitors in 14 days), ranked by use. A slot stays empty rather than go to a tool without that evidence.
    where: {all: [{attr: kind, eq: tool/incubating}, {attr: archived, eq: false},
                  {any: [{attr: release_downloads, gte: 100}, {attr: clone_uniques_14d, gte: 20}]}]}
    sort_by: usage_score
  - id: media
    quota: 6
    meaning: The websites, documentation, teaching material and example models, ranked by use.
    where: {all: [{attr: type, eq: media}, {attr: archived, eq: false}]}
    sort_by: usage_score
  - id: research
    quota: 4
    meaning: Research explored in public, ranked by use.
    where: {all: [{attr: type, eq: research}, {attr: archived, eq: false}]}
    sort_by: usage_score
  - id: should-be-archived
    quota: 6
    meaning: Live repositories with no changes in a year (WP1's archive-candidate flag), ranked by use, so the most
      relevant decisions come first.
    where: {all: [{attr: archive_candidate, eq: true}, {attr: fork, eq: false}]}
    sort_by: usage_score
  - id: forks
    quota: 2
    meaning: Forks related to SysML, ranked by use, kept unclassified on purpose to show that the taxonomy has no kind
      for forks.
    where: {all: [{attr: fork, eq: true}, {attr: archived, eq: false}, {any: [{attr: name, matches: sysml}, {attr: description, matches: sysml}]}]}
    sort_by: usage_score
