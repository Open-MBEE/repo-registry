# PROVISIONAL until the maintainers approve the taxonomy (WP0, maintainer approval 1).
# WP1 D-3. The four tiers and what they mean (WP0, "Four tiers across the kinds").
# A tier says how strict the controls are. Which policies a tier carries is WP2's job.
status: provisional
provisional_until: "WP0 maintainer approval 1: the taxonomy"

tiers:
  high:
    order: 1
    meaning: >-
      Core tools that need rigorous release control. Semantic versioning is required (carried to WP2).
  medium:
    order: 2
    meaning: >-
      Load-bearing media, such as the website, and tools that are ancillary or experimental.
      Semantic versioning is required (carried to WP2).
  low:
    order: 3
    meaning: >-
      Repos that need an owner but have no formal controls beyond someone who looks after them.
  none:
    order: 4
    meaning: >-
      Archived material. Read-only once its archived status has been verified, so it is inert.
