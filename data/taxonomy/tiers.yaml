# PROVISIONAL until the maintainers approve the taxonomy (WP0, maintainer approval 1).
# WP1 D-3. The four tiers and what they mean. A tier says how strict the controls are.
# Which policies apply is decided separately, by each policy's own rule (WP0 A1).
status: provisional
provisional_until: "WP0 maintainer approval 1: the taxonomy"

tiers:
  high:
    order: 1
    meaning: >-
      The strictest controls. For mature, graduated tools that many people depend on in real work, where every release
      must be carefully controlled, and for anything that governs the organization itself.
  medium:
    order: 2
    meaning: >-
      Moderate controls. For media that many people rely on, such as the website, and for tools that have released
      version 1.0 or later but are not yet graduated.
  low:
    order: 3
    meaning: >-
      Light controls. The repository needs a named person who looks after it, and nothing more. This includes tools
      that are still experimenting, with no release yet or releases numbered below 1.0.
  none:
    order: 4
    meaning: >-
      No controls. For archived repositories: once a repository is archived, nobody can change it, so there is
      nothing left to control.
