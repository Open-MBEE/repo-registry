# PROVISIONAL until the maintainers approve the taxonomy (WP0, maintainer approval 1).
# WP1 D-2. The kinds: type x lifecycle (WP1 R-3), each mapped to exactly one tier (WP1 R-6, WP0 R-17).
# A repo has a kind. A kind gives the repo three attributes: its type, its lifecycle and its tier. Policies attach
# to a type, a lifecycle or a tier (WP0 A1). Nothing here gives a repo a tier directly.
#
# `recommend_when` is a deterministic predicate over snapshot attributes (WP1 R-5). It only RECOMMENDS a
# repo's initial kind, as guidance. Governors assign kinds (WP1 A3).
# The rules must be mutually exclusive: a repo that matches two kinds, or none, is shown as unclassified.
#
# Predicate language (read by scripts/recommend.py, which names no kind, type or signal; WP1 R-7):
#   {all: [p, ...]}  {any: [p, ...]}  {not: p}  {signal: <name>}
#   {attr: <name>, eq: v | in: [..] | matches: <regex> | gt: n | gte: n | lt: n}
#   `matches` is a case-insensitive regex search; on a list attribute it is true if any element matches.
#   `recommend_when: false` means the rules never recommend that kind; only a governor assigns it.
# Attributes are the snapshot fields plus the derived ones listed in scripts/recommend.py.
#
# The `meaning` texts are written for anyone to read (WP0 R-4). In them, a "governor" is one of the OpenMBEE
# maintainers, who decide each repository's kind.
status: provisional
provisional_until: "WP0 maintainer approval 1: the taxonomy"

types:
  tool: Software that people install, run, or build on.
  media: The website, documentation, teaching material, example models, and the organization's shared pages and images.
  research: Ideas explored in public, often by one person working alone. Often archived once work on it stops.
  governance: >-
    The rules for the organization itself. Only two things are this type: the repo-registry repository, which
    holds these rules, and the administration of the GitHub organization. The administration isn't a repository,
    but it gets a kind in the same way, so that its controls can be checked too.

lifecycles:
  experimental: >-
    Early and still changing. For a tool, its releases are numbered below 1.0 (for example 0.4.2). When a tool
    releases version 1.0, it moves on: to active development if it is still changing, or to maintained if not.
  active-development: >-
    New features are being added. For a tool, it has released version 1.0 or later, and its recent releases add
    features (they raise the first or second number of the version, for example 2.3.0 to 2.4.0).
  maintained: >-
    Stable and offered for use, with no new features being added. For a tool, its recent releases only fix things
    (they raise just the last number of the version, for example 2.4.0 to 2.4.1), or it hasn't released lately.
    Maintenance is still active work: someone is expected to keep
    it safe and reliable, by keeping track of the other software it depends on, watching for publicly reported
    security flaws in it, and fixing what they find. Whether that work is actually being done is checked by the
    policies for maintained repositories, not by the repository's kind.
  unreleased: >-
    Tools only. A tool that has never published a numbered release (such as 1.2.0). It needs a named person to look
    after it, and nothing more, until it starts releasing.
  archived: >-
    Finished. The repository is archived on GitHub, so nobody can change it any more. This is the last stage.

# Signals are named building blocks the kinds share. They are data, not code.
signals:
  archived: {attr: archived, eq: true}
  fork: {attr: fork, eq: true}
  semver_release: {attr: has_semver_release, eq: true}
  semver_1_or_later: {attr: latest_semver_major, gte: 1}
  commits_last_3_months: {attr: commits_last_3_months, gt: 0}
  commits_last_12_months: {attr: commits_last_12_months, gt: 0}
  feature_release_last_12_months: {attr: feature_release_last_12_months, eq: true}
  media_words:
    any:
      - attr: name
        matches: '\.github\.io$|\.openmbee\.org$|^\.github$|^docs$|readthedocs|documentation|graphic-assets|user-forum|enhancement-proposals|specifications|cookbook|faq|examples|-model$|_model$|\.sysml$'
      - attr: description
        matches: '\bwebsite\b|\bsite\b|documentation|\btutorial\b|\bfaq\b|\bmodel of\b|system model|\bassets\b|\bforum\b|\bproposals\b'
  research_words:
    any:
      - attr: name
        matches: 'research|experiment|simulation|prompts'
      - attr: description
        matches: 'research|formali[sz]ation|probabilistic'
  code_language:
    all:
      - {attr: primary_language, matches: '.'}
      - not: {attr: primary_language, in: [HTML, CSS, Jupyter Notebook, TeX, Markdown]}
  # Forks mirror an upstream project. The taxonomy has no kind for them yet (WP0 parked item), so no kind
  # matches a fork and every fork is shown as unclassified with that reason (TX-4: no force fit).
  owned_here: {not: {signal: fork}}
  is_media: {all: [{signal: owned_here}, {signal: media_words}, {not: {signal: research_words}}]}
  is_research: {all: [{signal: owned_here}, {signal: research_words}, {not: {signal: media_words}}]}
  is_tool: {all: [{signal: owned_here}, {signal: code_language}, {not: {signal: media_words}}, {not: {signal: research_words}}]}
  live: {not: {signal: archived}}

kinds:
  # --- tools ---
  tool/active-development:
    type: tool
    lifecycle: active-development
    tier: high
    meaning: >-
      A tool at version 1.0 or later that people depend on and that is still gaining new features. Every release
      needs careful control, so it gets the strictest controls.
    recommend_when:
      all: [{signal: is_tool}, {signal: live}, {signal: semver_1_or_later}, {signal: feature_release_last_12_months}]
  tool/maintained:
    type: tool
    lifecycle: maintained
    tier: high
    meaning: >-
      A stable tool at version 1.0 or later that people rely on, and that someone is expected to look after actively:
      tracking what it depends on and fixing reported security flaws. It gets the strictest controls because people
      rely on its releases.
    recommend_when:
      all: [{signal: is_tool}, {signal: live}, {signal: semver_1_or_later}, {not: {signal: feature_release_last_12_months}}]
  tool/experimental:
    type: tool
    lifecycle: experimental
    tier: medium
    meaning: >-
      A tool whose releases are still numbered below 1.0. It can change fast. When it releases version 1.0, it
      becomes a tool in active development (or maintained, if it has stopped changing), and its controls get stricter.
    recommend_when:
      all: [{signal: is_tool}, {signal: live}, {signal: semver_release}, {not: {signal: semver_1_or_later}}]
  tool/unreleased:
    type: tool
    lifecycle: unreleased
    tier: low
    departure: >-
      Not in the type x lifecycle cross product. Added because a tool can be in the low tier without semantic
      versioning (supervisor, WP1 OD3), while the tools numbered below 1.0 are experimental (medium). Without this
      kind, a tool that has never released has no low-tier kind to land in.
    meaning: >-
      A tool that has never published a numbered release. It needs a named person to look after it, and nothing more,
      until it starts releasing.
    recommend_when:
      all: [{signal: is_tool}, {signal: live}, {not: {signal: semver_release}}]
  tool/archived:
    type: tool
    lifecycle: archived
    tier: none
    meaning: An archived tool. Nobody can change it any more.
    recommend_when:
      all: [{signal: is_tool}, {signal: archived}]

  # --- media ---
  media/active-development:
    type: media
    lifecycle: active-development
    tier: medium
    meaning: >-
      Media that many people rely on, such as the website, that is still gaining new content.
    recommend_when:
      all: [{signal: is_media}, {signal: live}, {signal: commits_last_12_months}]
  media/maintained:
    type: media
    lifecycle: maintained
    tier: medium
    meaning: >-
      Stable media that people still use, and that someone is expected to look after.
    recommend_when:
      all: [{signal: is_media}, {signal: live}, {not: {signal: commits_last_12_months}}]
  media/experimental:
    type: media
    lifecycle: experimental
    tier: low
    meaning: Draft or trial media. The rules never suggest this kind. The maintainers who run the OpenMBEE organization on GitHub choose it directly.
    recommend_when: false
  media/archived:
    type: media
    lifecycle: archived
    tier: none
    meaning: Archived media. Nobody can change it any more.
    recommend_when:
      all: [{signal: is_media}, {signal: archived}]

  # --- research ---
  research/experimental:
    type: research
    lifecycle: experimental
    tier: low
    meaning: >-
      Ideas being explored in public, often by one person. Controls are kept light on purpose, so that this kind of
      work stays easy.
    recommend_when:
      all: [{signal: is_research}, {signal: live}]
  research/active-development:
    type: research
    lifecycle: active-development
    tier: low
    meaning: Research being worked on toward a result. The rules never suggest this kind. The maintainers who run the OpenMBEE organization on GitHub choose it directly.
    recommend_when: false
  research/maintained:
    type: research
    lifecycle: maintained
    tier: low
    meaning: >-
      Finished research kept available, for example alongside a paper. The rules never suggest this kind. The maintainers who run the OpenMBEE organization on GitHub choose it directly.
    recommend_when: false
  research/archived:
    type: research
    lifecycle: archived
    tier: none
    meaning: Archived research. Nobody can change it any more.
    recommend_when:
      all: [{signal: is_research}, {signal: archived}]

  # --- governance (WP0 A2, WP1 A2): always assigned, never recommended ---
  governance/experimental:
    type: governance
    lifecycle: experimental
    tier: high
    meaning: >-
      Rules for the organization that are still being built. Only the repo-registry repository, which holds these rules, has this kind. It gets the
      strictest controls, because whatever governs must be at least as strict as what it governs.
    recommend_when: false
  governance/maintained:
    type: governance
    lifecycle: maintained
    tier: high
    meaning: >-
      The administration of the GitHub organization itself: who can do what across all its repositories. It gets the
      strictest controls, because whatever governs must be at least as strict as what it governs.
    recommend_when: false

# Kinds in the type x lifecycle cross product that are deliberately left out, each with its reason (WP1 R-3).
omitted:
  governance/active-development: Only two things have the governance type, and neither is at this stage.
  governance/archived: Only two things have the governance type, and neither is archived.
  governance/unreleased: The unreleased stage is for tools only.
  media/unreleased: The unreleased stage is for tools only.
  research/unreleased: The unreleased stage is for tools only.

# Why a repo is unclassified: the first `when` that holds gives the reason. Data, so the engine names nothing.
unclassified_reasons:
  - when: {signal: fork}
    reason: A fork of an upstream project. The taxonomy has no kind for forks yet (WP0 parked item).
  - when: {all: [{signal: media_words}, {signal: research_words}]}
    reason: Its name or description reads as both media and research.
  - when: {all: [{signal: archived}, {not: {any: [{signal: media_words}, {signal: research_words}, {signal: code_language}]}}]}
    reason: Archived, with no type signal. Inert whatever its type.
  - when: {not: {any: [{signal: media_words}, {signal: research_words}, {signal: code_language}]}}
    reason: No type signal. No media or research words, and no programming language.

# Flags are shown in the recommendation report, never in the kind list. They don't change a kind.
flags:
  archive-candidate:
    meaning: Not archived, and no commits on the default branch in the last 12 months.
    when: {all: [{signal: owned_here}, {signal: live}, {not: {signal: commits_last_12_months}}]}
